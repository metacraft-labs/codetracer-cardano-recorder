[package]
license = "Apache-2.0"
name = "codetracer-cardano-recorder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codetracer-cardano-recorder"
path = "src/main.rs"

[dependencies]
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
# CXP-ADA-1: the recorder must observe script execution *inside* the chain's
# own evaluator, which requires the public CEK stepping API
# (`Machine::get_initial_machine_state` / `Machine::step`, plus public
# `MachineState` / `Context` / `Env`).  That API is not in the crates.io
# release, so the dependency points at the workspace fork, where it landed as
# `baeb591a` and is an ancestor of `origin/codetracer`.  The fork is the same
# version (1.1.21) as the registry crate, so this is a drop-in redirect.
uplc = { path = "../metacraft-aiken-fork/crates/uplc" }
# CXP-ADA-1 deliverable 3: the compiler must actually be invoked, so the
# artifact this recorder executes is the artifact the compiler produced rather
# than one of our own parsing. The whole front-end this needs — the lexer and
# parser (`parser::module`), the type checker (`UntypedModule::infer`), the
# prelude (`builtins::{prelude, plutus, prelude_functions, prelude_data_types}`)
# and the code generator (`CodeGenerator::generate_raw`) — is public in
# `aiken-lang`, so this is the whole dependency and `aiken-project` is NOT
# needed.
#
# THAT WAS MEASURED, not assumed, because the cost differs by a factor of
# seven: `Cargo.lock` carries 269 packages without either, 301 with
# `aiken-lang` (+32) and 479 with `aiken-project` as well (+210 — it pulls
# `reqwest`, `tokio`, `zip`, `askama`, `notify`, `rayon` and miette's fancy
# reporter for a project/validator/blueprint pipeline this repo has no subject
# for: there is no `aiken.toml` anywhere in it and the corpus is 19 bare
# modules).
#
# Same fork and same version (1.1.21) as the `uplc` path dep above, so the two
# resolve to one checkout; CI already clones it (`03e3ec3`).
aiken-lang = { path = "../metacraft-aiken-fork/crates/aiken-lang" }
hex = "0.4"
# Named directly because `aiken-lang`'s own API is in terms of it:
# `TypedModule::register_definitions` and `CodeGenerator::new` take
# `IndexMap`s, so a consumer has to be able to spell the type. Pinned to the
# 1.x line `aiken-lang` uses, so this adds a dependency EDGE and not a version
# — `Cargo.lock` already carried indexmap 1.9.3 once `aiken-lang` was added.
indexmap = "1.9"
pallas-primitives = "0.33"
pallas-codec = "0.33"
# CXP-ADA-2 acquisition: era-generic transaction decoding (`MultiEraTx`), the
# blake2b hashers the chain identifies scripts and datums with, and the address
# decoder that reads a script hash off a spent output. All three were already in
# `Cargo.lock` transitively at 0.33, so this adds dependency EDGES and not
# versions.
pallas-traverse = "0.33"
pallas-crypto = "0.33"
pallas-addresses = "0.33"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
