[package]
license = "Apache-2.0"
name = "codetracer-cardano-recorder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codetracer-cardano-recorder"
path = "src/main.rs"

[dependencies]
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
uplc = "1.1.21"
hex = "0.4"
pallas-primitives = "0.33"
pallas-codec = "0.33"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
# Reads the recorded `paths.dat` line-count table back in tests.
codetracer_trace_reader = { path = "../codetracer-trace-format/codetracer_trace_reader" }
tempfile = "3"
# The compiler's own front-end and code generator, for the fixture gate in
# `tests/test_corpus_is_valid_aiken.rs` and nothing else: no code in `src/`
# reaches it. The version is the `uplc` dependency's, so the graph keeps one
# `uplc` and the gate evaluates what it compiled with the machine the recorder
# links.
aiken-lang = "1.1.21"
# `aiken-lang`'s `CodeGenerator::new` and `register_definitions` take
# `IndexMap`s, so the gate has to name the type. This is the 1.x line
# `aiken-lang` itself uses.
indexmap = "1.9"
