name: CI

# Re-plays the project's deterministic dev env on the runner via the shared
# reusable recorder-CI workflow (nixos-modules). Recorder-specific prep lives in
# the `prepare-ci` just recipe; the shared workflow runs it after setup-dev-env
# and before lint/test, then uploads logs to GitHub (short retention) and
# mirrors them to the in-house S3 artifact store. Runs on the CIP-3 eph-3-class
# runner matrix (the reusable workflow's default).
# See:
#   https://github.com/metacraft-labs/metacraft-dev-guidelines/blob/latest/policies/ci-workflow-standards.md

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-recorder-ci.yml@dev
    with:
      prepare-recipe: prepare-ci
      # `.github/sibling-repos` names `aiken-lang/stdlib`; setup-dev-env
      # clones a sibling only when its owner is in the token's scope.
      token-owner: metacraft-labs aiken-lang
    secrets: inherit

  # The source-only packaging channels (homebrew, nix, aur, scoop,
  # chocolatey) verify without a build, so they run on every push and pull
  # request here; deb and rpm are verified in publish-deb.yml / publish-rpm.yml
  # on the package just built. `verify-package` is strict: a missing tool
  # fails the job instead of passing it vacuously.
  packaging:
    name: Verify packaging sources
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          # `.github/sibling-repos` names `aiken-lang/stdlib`; setup-dev-env
          # clones a sibling only when its owner is in the token's scope.
          token-owner: metacraft-labs aiken-lang
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Verify packaging sources
        run: dev-exec just verify-packaging-sources
