name: CI

# Pilot consumer for the shared `setup-dev-env` composite action.
#
# CI's job is to re-play the project's deterministic dev env on
# the runner -- the same env a developer uses locally to run
# `nix develop -c just test`.  All toolchain bootstrapping lives
# in `flake.nix` (or `env.ps1` on Windows); CI only materialises
# that env and invokes `dev-exec just <target>`.
#
# See:
#   https://github.com/metacraft-labs/metacraft-dev-guidelines/blob/latest/policies/ci-shared-dev-env.md

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout metacraft-manifests (workspace locks)
        uses: actions/checkout@v5
        with:
          repository: metacraft-labs/metacraft-manifests
          ref: latest
          path: _manifests
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve cross-repo workspace-lock SHA
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) CANDS="${{ github.event.pull_request.base.sha }}" ;;
            push) CANDS="${{ github.sha }} ${{ github.event.before }}" ;;
            *) CANDS="${{ github.sha }}" ;;
          esac
          LOCK_SHA=""
          for c in $CANDS; do
            [ -z "$c" ] && continue
            [ "$c" = "0000000000000000000000000000000000000000" ] && continue
            if "${{ github.workspace }}/scripts/resolve-sibling-rev.sh" \
                 --repo codetracer-cardano-recorder --sibling codetracer \
                 --manifest-dir "${{ github.workspace }}/_manifests" \
                 --sha "$c" --no-walk >/dev/null 2>&1; then
              LOCK_SHA="$c"; break
            fi
          done
          if [ -z "$LOCK_SHA" ]; then
            echo "::error::No repo-workspaces workspace lock for codetracer-cardano-recorder (candidates: $CANDS). The commit must be published through the workspace tooling."
            exit 1
          fi
          echo "CT_MANIFEST_DIR=${{ github.workspace }}/_manifests" >> "$GITHUB_ENV"
          echo "CT_LOCK_SHA=$LOCK_SHA" >> "$GITHUB_ENV"
          echo "Resolved cross-repo lock SHA for codetracer-cardano-recorder: $LOCK_SHA"

      - name: Clone codetracer-trace-format sibling
        # Cargo path dependency expected at $GITHUB_WORKSPACE/../
        # codetracer-trace-format.  The revision comes from the
        # repo-workspaces workspace lock so dev + CI track the same SHA.
        shell: bash
        run: |
          # The resolver returns the workspace-locked SHA (not a branch
          # name), so fetch that exact commit and check it out detached.
          TF_REF="$("${{ github.workspace }}/scripts/resolve-sibling-rev.sh" \
            --repo codetracer-cardano-recorder --sibling codetracer-trace-format \
            --manifest-dir "$CT_MANIFEST_DIR" --sha "$CT_LOCK_SHA" --no-walk)"
          DEST="${GITHUB_WORKSPACE}/../codetracer-trace-format"
          rm -rf "$DEST"
          git clone --no-checkout "https://github.com/metacraft-labs/codetracer-trace-format.git" "$DEST"
          git -C "$DEST" fetch --depth 1 origin "${TF_REF}"
          git -C "$DEST" checkout --detach FETCH_HEAD

      - name: Clone codetracer-trace-format-nim sibling
        # The Nim FFI source is consumed both by the dev-shell-
        # bundled trace-writer-lib build below and (on dev
        # machines) by direct path-import.
        run: |
          rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
          git clone --depth 1 \
            "https://github.com/metacraft-labs/codetracer-trace-format-nim.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"

      - name: Setup dev env
        # Materialises the flake.nix devShell on the runner.  The
        # dev shell already provides nim, nimble, capnproto,
        # zstd, rust, just -- the same toolchain a developer gets
        # locally with `nix develop`.  After this step,
        # `dev-exec <cmd>` runs <cmd> inside that env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nim trace writer library (sibling artifact)
        # codetracer_trace_writer_nim's build.rs links against
        # libcodetracer_trace_writer.a at
        # $CODETRACER_NIM_LIB_DIR.  Build it via the dev env so
        # the toolchain (nim, nimble, gcc) comes from flake.nix
        # rather than ad-hoc CI installs.
        #
        # TODO: once codetracer-trace-format-nim ships a
        # `just build-trace-writer-lib` target, replace this
        # block with `direnv exec ../codetracer-trace-format-nim
        # just build-trace-writer-lib` per the
        # cross-repo-builds.md policy.
        run: |
          dev-exec bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
            nimble install -y stew results
            nim c --app:staticlib --mm:arc --noMain -d:release -p:src \
              -o:libcodetracer_trace_writer.a src/codetracer_trace_writer_ffi.nim
          '
          echo "CODETRACER_NIM_LIB_DIR=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim" >> "$GITHUB_ENV"

      - name: Lint
        run: dev-exec just lint

      - name: Test
        run: dev-exec just test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/
          retention-days: 7
