name: Windows Build
on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches-ignore: [agents]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, windows, x64], [self-hosted, windows, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup dev env
        # setup-dev-env clones the listed siblings at the
        # workspace-lock-pinned revisions and installs `dev-exec`, which
        # replays this repo's Windows DIY dev env (env.ps1 → Rust,
        # capnproto, Nim) for each wrapped command. This replaces the
        # open-coded manifest/resolve/clone steps plus the
        # dtolnay/rust-toolchain + choco capnproto/Nim installs.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.app-token.outputs.token }}
          siblings: |
            codetracer-trace-format
            codetracer-trace-format-nim

      - name: Check
        run: dev-exec cargo check
      - name: Test
        run: dev-exec cargo test
